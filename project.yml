name: CapTemps
options:
  deploymentTarget:
    iOS: "17.4"
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: "1.0"
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
targets:
  CapTemps:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPTEMPS_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: CapTemps
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CapTempsAppGroup: $(CAPTEMPS_APP_GROUP)
    entitlements:
      path: App/CapTemps.entitlements
      properties: &sharedCapabilities
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(CAPTEMPS_APP_GROUP)
    dependencies:
      - target: CapTempsMonitor
        embed: true
      - target: CapTempsShieldConfiguration
        embed: true
      - target: CapTempsShieldAction
        embed: true

  CapTempsMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPTEMPS_BUNDLE_ID).monitor
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: Monitor/CapTempsMonitor.entitlements
      properties: *sharedCapabilities
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: CapTemps Monitor
        CapTempsAppGroup: $(CAPTEMPS_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActivityMonitor

  CapTempsShieldConfiguration:
    type: app-extension
    platform: iOS
    sources: [ShieldConfiguration, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPTEMPS_BUNDLE_ID).shield-configuration
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: ShieldConfiguration/CapTempsShieldConfiguration.entitlements
      properties: *sharedCapabilities
    info:
      path: ShieldConfiguration/Info.plist
      properties:
        CapTempsAppGroup: $(CAPTEMPS_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldAppearance

  CapTempsShieldAction:
    type: app-extension
    platform: iOS
    sources: [ShieldAction, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPTEMPS_BUNDLE_ID).shield-action
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: ShieldAction/CapTempsShieldAction.entitlements
      properties: *sharedCapabilities
    info:
      path: ShieldAction/Info.plist
      properties:
        CapTempsAppGroup: $(CAPTEMPS_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionHandler

schemes:
  CapTemps:
    build:
      targets:
        CapTemps: all
    run:
      config: Debug
